
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Result Management System</h1>

        <div id="message" class="message"></div>

        <section class="form-card">
            <h2 id="formTitle">Add Student</h2>

            <form id="studentForm">
                <input type="hidden" id="studentId">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" required>
                    </div>

                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" required>
                    </div>

                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" required>
                    </div>

                    <div class="form-group">
                        <label for="roll">Roll</label>
                        <input type="text" id="roll" required>
                    </div>

                    <div class="form-group">
                        <label for="marks">Marks (0–100)</label>
                        <input
                            type="number"
                            id="marks"
                            min="0"
                            max="100"
                            step="1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="result">Calculated Result</label>
                        <input
                            type="text"
                            id="result"
                            placeholder="Calculated by backend"
                            readonly
                        >
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitBtn">Add Student</button>
                    <button type="button" id="cancelBtn" class="secondary" hidden>
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <section class="table-card">
            <div class="table-heading">
                <h2>Student List</h2>
                <button type="button" id="refreshBtn" class="secondary">
                    Refresh
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Department</th>
                            <th>Roll</th>
                            <th>Marks</th>
                            <th>Result</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable">
                        <tr>
                            <td colspan="8">Loading students...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
